source: openapi/sharethis-platform-api.json (4xx/5xx responses + components.schemas.Response)
format: code-envelope
rfc9457: false
envelope:
  media_type: application/json
  schema: components.schemas.Response
  shape:
    code: string — machine-readable outcome code, REQUIRED (example PROPERTY_CREATED)
    data: object, nullable
  note: >-
    ShareThis uses ONE response envelope for both success and failure, discriminated by the `code`
    string rather than by a distinct error schema. It is not RFC 9457 problem+json: there is no
    type/title/detail/instance and no application/problem+json media type. An agent must branch on
    HTTP status plus the `code` value; there is no machine-readable pointer to documentation for a
    given failure. The spec also declares the 4xx/5xx responses with prose descriptions and, for
    several of them, no content schema at all — so the error BODY for those is undescribed.
gaps:
  undescribed_error_bodies: >-
    Several 4xx/5xx responses in the spec declare no content schema, so their payload shape is not
    machine-readable from the contract.
  no_documented_error_reference: >-
    No public error-code reference page was found on sharethis.com; the codes below are the ones the
    OpenAPI itself names.
