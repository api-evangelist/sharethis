domain_standards:
- id: iab-tcf
  name: IAB Europe Transparency and Consent Framework (TCF)
  conforms: partial
  scored: false
  evidence: >-
    ShareThis's GitHub organization carries forks of the official TCF technical specifications
    (GDPR-Transparency-and-Consent-Framework) and the official IAB TCF tool suite (iabtcf-es), both
    now ARCHIVED, and the company ships a Consent Management Platform product. This is an
    organizational/product signal, NOT a contract signal — the Platform API contract declares no TCF
    string, no consent payload and no CMP interface, so it earns no domain_standard_conformance
    credit here. Recorded because the adtech regime is where a ShareThis domain standard would
    live, and this is the honest state of it.
  caveat: >-
    Both TCF repositories are archived, so this reflects past participation rather than current
    maintained conformance.
- id: openrtb
  name: OpenRTB
  conforms: false
  evidence: >-
    ShareThis operates in programmatic advertising (audiences, targeting, data feeds) where OpenRTB
    is the market standard, but no bid endpoint, bid request/response schema or OpenRTB reference
    appears in any published ShareThis contract. The data business is delivered through partner
    platforms (LiveRamp, The Trade Desk) rather than through a ShareThis-published RTB surface.
compliance_certifications:
  published: false
  evidence: >-
    probe-security-programs.py found no trust center and no named certification (SOC 2 / ISO 27001 /
    PCI / HIPAA / FedRAMP) on any ShareThis property. Privacy commitments are published at
    https://sharethis.com/privacy/ with GDPR/CCPA data-subject request and do-not-sell mechanisms
    (https://sharethis.com/data-subject-privacy-request/,
    https://sharethis.com/do-not-sell-my-data-page/), but these are legal policy pages, not an
    audited compliance program.
