standards:
- id: openapi
  name: OpenAPI Specification
  conforms: true
  version: 3.0.3
  evidence: >-
    openapi/sharethis-platform-api.json parses as OpenAPI 3.0.3 with 12 paths / 14 operations,
    10 component schemas and a declared securityScheme. Served publicly and unauthenticated at
    https://platform-api.sharethis.com/v2.0/openapi.json.
- id: mcp
  name: Model Context Protocol
  conforms: true
  evidence: >-
    Live JSON-RPC 2.0 tools/list at https://mcp.sharethis.com returned nine tools each carrying
    inputSchema, outputSchema and annotations. Provider documents the server at
    https://sharethis.com/mcp/ and publishes connection guides for ChatGPT, Claude, Cursor and Manus.
- id: oauth2
  name: OAuth 2.1
  conforms: true
  evidence: >-
    authorization_code and client_credentials grants with mandatory PKCE S256, advertised at
    https://mcp.sharethis.com/.well-known/oauth-authorization-server.
- id: rfc8414
  name: OAuth 2.0 Authorization Server Metadata
  conforms: true
  evidence: >-
    /.well-known/oauth-authorization-server returns HTTP 200 with issuer, authorization_endpoint,
    token_endpoint, response_types_supported, grant_types_supported,
    token_endpoint_auth_methods_supported and code_challenge_methods_supported.
- id: rfc9728
  name: OAuth 2.0 Protected Resource Metadata
  conforms: true
  evidence: >-
    /.well-known/oauth-protected-resource returns HTTP 200 with resource, authorization_servers and
    scopes_supported (mcp:tools).
- id: rfc7636
  name: PKCE
  conforms: true
  evidence: 'code_challenge_methods_supported: ["S256"] — S256 only, plain is not offered.'
- id: oidc
  name: OpenID Connect
  conforms: false
  evidence: >-
    An /.well-known/openid-configuration document is served, but it advertises no id_token, no
    userinfo_endpoint and no jwks_uri. It is an OAuth metadata document under an OIDC filename, not
    an OIDC provider.
- id: rfc9457
  name: Problem Details for HTTP APIs
  conforms: false
  evidence: >-
    Errors use a proprietary {code, data} envelope with no application/problem+json media type and
    no type/title/detail/instance members.
- id: rfc9116
  name: security.txt
  conforms: false
  evidence: >-
    /.well-known/security.txt returns 404 on mcp.sharethis.com and platform-api.sharethis.com and
