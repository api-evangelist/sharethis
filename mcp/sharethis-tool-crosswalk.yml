    gated: false
    note: Spec is served publicly and unauthenticated; the operations it describes need a bearer token.
  mcp:
    url: https://mcp.sharethis.com
    gated: false
    note: >-
      tools/list is anonymous — schemas were read directly, not inferred. Tool INVOCATION is
      OAuth-gated.
  graphql:
    present: false
