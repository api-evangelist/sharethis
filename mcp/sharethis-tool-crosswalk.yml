source: >-
  mcp/sharethis-mcp-tools.json (live anonymous tools/list, 2026-08-27) bound against
  openapi/sharethis-platform-api.json (ShareThis Platform API 2.0.0)
note: >-
  ShareThis's MCP server and Platform API are unusually close projections of one core: eight of the
  nine MCP tools map 1:1 onto a REST operation, and the naming is nearly mechanical
  (sharethis_<resource>_<verb> -> /<resource> <METHOD>). Confidence is high on those eight because
  BOTH sides published machine-readable schemas that could be compared field by field — the MCP
  inputSchemas and the OpenAPI parameters/requestBodies agree. Only one tool is MCP-only and only
  four operations are REST-only.
