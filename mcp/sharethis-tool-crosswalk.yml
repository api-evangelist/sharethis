mcp_only:
- tool: sharethis_apps_liveview
  reason: >-
    Composite/rendering tool with no backing public REST operation. It resolves a property's saved
    app configuration and renders the live view through the property's sharethis.js runtime rather
    than returning a plain resource representation, so there is nothing in the Platform API spec to
    bind it to.
rest_only:
- operation: 'POST /auth/login'
  reason: >-
    Bearer-token issuance for REST clients. The MCP surface uses OAuth 2.1 authorization-code +
    PKCE instead, so this login exchange has deliberately no tool equivalent.
- operation: 'POST /oauth-clients'
  reason: OAuth client registration — administrative, not exposed as an agent tool.
- operation: 'GET /oauth-clients'
  reason: OAuth client listing — administrative, not exposed as an agent tool.
- operation: 'DELETE /oauth-clients/{client_id}'
  reason: OAuth client deletion — administrative, not exposed as an agent tool.
- operation: 'POST /generate-ai-summary'
  reason: >-
    AI summary generation is in the REST contract but has no MCP tool. A notable gap — this is the
    operation an agent would most plausibly want, and it is reachable over REST only.
- operation: 'POST /audience-pageviews'
  reason: >-
    Audience pageview retrieval is in the REST contract but has no MCP tool; agent access to
    audience data is REST-only.
