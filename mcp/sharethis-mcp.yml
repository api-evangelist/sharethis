generated: '2026-08-27'
method: probed
source: https://mcp.sharethis.com/ (landing page + live JSON-RPC tools/list, 2026-08-27)
name: ShareThis MCP
description: >-
  First-party remote Model Context Protocol server that exposes ShareThis property and app
  management to AI assistants. Documented on ShareThis's own site at https://sharethis.com/mcp/
  and served from mcp.sharethis.com with a human-readable landing page on GET / and the JSON-RPC
  endpoint on POST / (the host root — NOT /mcp, which returns 404).
deployment:
  mode: remote
  endpoint: https://mcp.sharethis.com
  auth: oauth
  verified: probed
  note: >-
    Remote-only. ShareThis ships no stdio/npx package for this server — there is no ShareThis MCP
    package on npm or PyPI and the provider's own connection guides for ChatGPT, Claude, Cursor and
    Manus all instruct the user to add https://mcp.sharethis.com as a REMOTE server URL and complete
    an OAuth login. An agent can reach this surface without anyone installing anything.
transport:
  protocol: JSON-RPC 2.0
  endpoint: POST /
  docs_page: GET /
  discovery: >-
    tools/list responds ANONYMOUSLY with the complete tool set including full inputSchema and
    outputSchema for every tool. Tool INVOCATION requires an OAuth bearer token; discovery does not.
    This is unusually open — most catalogued MCP servers return an OAuth challenge on tools/list and
    leave their schemas unreadable without credentials.
authentication:
  type: oauth2
  flows:
  - authorization_code
  - client_credentials
  pkce: S256
  scopes:
  - mcp:tools
  authorization_endpoint: https://mcp.sharethis.com/oauth/authorize
  token_endpoint: https://mcp.sharethis.com/oauth/token
  issuer: https://mcp.sharethis.com
  metadata:
  - well-known/sharethis-mcp-oauth-protected-resource.json
  - well-known/sharethis-mcp-oauth-authorization-server.json
  - well-known/sharethis-mcp-openid-configuration.json
  account_prerequisite: >-
    A ShareThis account created at https://platform.sharethis.com is required before OAuth linking
    will succeed.
clients_documented:
- ChatGPT
- Claude
- Cursor
- Manus
tool_count: 9
tools_file: mcp/sharethis-mcp-tools.json
status: live
tools:
- name: sharethis_properties_create
  title: Create Property
  description: Create a property for the authenticated user.
  read_only: false
  destructive: false
- name: sharethis_properties_list
  title: List Properties
  description: List properties for the authenticated user.
  read_only: true
  destructive: false
- name: sharethis_properties_get
  title: Get Property
  description: Get a property by ID.
  read_only: true
  destructive: false
- name: sharethis_properties_validate
  title: Validate Property
  description: Validate property ownership via domain file.
  read_only: false
  destructive: false
- name: sharethis_apps_upsert
  title: Upsert App
  description: Create or update an app config for a property.
  read_only: false
  destructive: false
- name: sharethis_apps_list
  title: List Apps
  description: List apps configured for a property.
  read_only: true
  destructive: false
- name: sharethis_apps_get
  title: Get App
  description: Get configuration for a specific app on a property.
  read_only: true
  destructive: false
- name: sharethis_apps_delete
  title: Delete App
  description: Remove an app from a property.
  read_only: false
  destructive: true
- name: sharethis_apps_liveview
  title: App Live View
  description: >-
    Show the live saved view of a ShareThis app using the property sharethis.js runtime.
  read_only: true
  destructive: false
annotations_published: true
annotations_note: >-
  Every tool carries MCP annotations (readOnlyHint, destructiveHint, openWorldHint). Exactly one
  tool — sharethis_apps_delete — is flagged destructiveHint:true, which is the signal an agent
  needs to gate that call behind confirmation. Publishing honest per-tool annotations is rare in
  the catalogue and is a genuine agent-safety strength here.
related_servers:
- name: Predactiv MCP
  endpoint: https://mcp.predactiv.com
  status: gated
  auth: oauth2 (bearer; AUTH_REQUIRED on anonymous tools/list)
  authorization_servers:
  - https://platform-api.predactiv.com/v2/oauth
  samples_repo: https://github.com/sharethis-github/predactiv-mcp-python-samples
  ownership_note: >-
    Different domain, same company. ShareThis rebranded as Predactiv in 2024 and now trades as
    "ShareThis, a Predactiv Company"; the Predactiv MCP sample repository is published inside
    ShareThis's OWN GitHub organization (sharethis-github) with homepage predactiv.com, which is
    the provider's own evidence that the two surfaces belong to one company.
  note: >-
    Recorded as a lead only. Anonymous tools/list returns 401 AUTH_REQUIRED, so the tool set and
    input schemas could NOT be read and nothing about them is asserted here. This is the Predactiv
    Data Platform (audiences, datasets, ML models, destinations), a different product from the
    ShareThis website-tools MCP above; it is not counted in tool_count and is not wired as a
    ShareThis API entry.
