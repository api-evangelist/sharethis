tools:
- name: sharethis_properties_create
  description: Create a property for the authenticated user.
  title: Create Property
  read_only: false
  destructive: false
- name: sharethis_properties_list
  description: List properties for the authenticated user.
  title: List Properties
  read_only: true
  destructive: false
- name: sharethis_properties_get
  description: Get a property by ID.
  title: Get Property
  read_only: true
  destructive: false
- name: sharethis_properties_validate
  description: Validate property ownership via domain file.
  title: Validate Property
  read_only: false
  destructive: false
- name: sharethis_apps_upsert
  description: Create or update an app config for a property.
  title: Upsert App
  read_only: false
  destructive: false
- name: sharethis_apps_list
  description: List apps configured for a property.
  title: List Apps
  read_only: true
  destructive: false
- name: sharethis_apps_get
  description: Get configuration for a specific app on a property.
  title: Get App
  read_only: true
  destructive: false
- name: sharethis_apps_delete
  description: Remove an app from a property.
  title: Delete App
  read_only: false
  destructive: true
- name: sharethis_apps_liveview
  description: Show the live saved view of a ShareThis app using the property sharethis.js runtime.
  title: App Live View
  read_only: true
  destructive: false
annotations_published: true
annotations_note: Every tool carries MCP annotations (readOnlyHint, destructiveHint, openWorldHint). Exactly
  one tool — sharethis_apps_delete — is flagged destructiveHint:true, which is the signal an agent needs
  to gate that call behind confirmation. Publishing honest per-tool annotations is rare in the catalogue
  and is a genuine agent-safety strength here.
related_servers:
- name: Predactiv MCP
  endpoint: https://mcp.predactiv.com
  status: gated
  auth: oauth2 (bearer; AUTH_REQUIRED on anonymous tools/list)
  authorization_servers:
  - https://platform-api.predactiv.com/v2/oauth
  samples_repo: https://github.com/sharethis-github/predactiv-mcp-python-samples
  ownership_note: Different domain, same company. ShareThis rebranded as Predactiv in 2024 and now trades
    as "ShareThis, a Predactiv Company"; the Predactiv MCP sample repository is published inside ShareThis's
    OWN GitHub organization (sharethis-github) with homepage predactiv.com, which is the provider's own
    evidence that the two surfaces belong to one company.
  note: Recorded as a lead only. Anonymous tools/list returns 401 AUTH_REQUIRED, so the tool set and input
    schemas could NOT be read and nothing about them is asserted here. This is the Predactiv Data Platform
    (audiences, datasets, ML models, destinations), a different product from the ShareThis website-tools
    MCP above; it is not counted in tool_count and is not wired as a ShareThis API entry.
