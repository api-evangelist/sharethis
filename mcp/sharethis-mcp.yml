generated: '2026-08-27'
method: probed
source: https://mcp.sharethis.com/ (landing page + live JSON-RPC tools/list, 2026-08-27)
name: ShareThis MCP
description: First-party remote Model Context Protocol server that exposes ShareThis property and app
  management to AI assistants. Documented on ShareThis's own site at https://sharethis.com/mcp/ and served
  from mcp.sharethis.com with a human-readable landing page on GET / and the JSON-RPC endpoint on POST
  / (the host root — NOT /mcp, which returns 404).
deployment:
  mode: remote
  endpoint: https://mcp.sharethis.com
  auth: oauth
  verified: probed
  note: Remote-only. ShareThis ships no stdio/npx package for this server — there is no ShareThis MCP
    package on npm or PyPI and the provider's own connection guides for ChatGPT, Claude, Cursor and Manus
    all instruct the user to add https://mcp.sharethis.com as a REMOTE server URL and complete an OAuth
    login. An agent can reach this surface without anyone installing anything.
transport:
  protocol: JSON-RPC 2.0
  endpoint: POST /
  docs_page: GET /
  discovery: tools/list responds ANONYMOUSLY with the complete tool set including full inputSchema and
    outputSchema for every tool. Tool INVOCATION requires an OAuth bearer token; discovery does not. This
    is unusually open — most catalogued MCP servers return an OAuth challenge on tools/list and leave
    their schemas unreadable without credentials.
authentication:
  type: oauth2
  flows:
  - authorization_code
  - client_credentials
  pkce: S256
  scopes:
  - mcp:tools
  authorization_endpoint: https://mcp.sharethis.com/oauth/authorize
  token_endpoint: https://mcp.sharethis.com/oauth/token
  issuer: https://mcp.sharethis.com
  metadata:
  - well-known/sharethis-mcp-oauth-protected-resource.json
  - well-known/sharethis-mcp-oauth-authorization-server.json
  - well-known/sharethis-mcp-openid-configuration.json
  account_prerequisite: A ShareThis account created at https://platform.sharethis.com is required before
    OAuth linking will succeed.
clients_documented:
- ChatGPT
- Claude
- Cursor
- Manus
tool_count: 9
