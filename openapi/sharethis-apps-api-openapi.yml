    StickyShareButtonsConfig:
      type: object
      properties:
        app_id:
          type: string
          enum:
          - sticky-share-buttons
        enabled:
          type: boolean
          default: true
        alignment:
          type: string
          default: left
        background_color:
          type: string
          default: '#B581A3'
        color:
          type: string
          default: social
        has_spacing:
          type: boolean
          default: false
        hide_desktop:
          type: boolean
          default: false
        text_color:
          type: string
          default: '#fff'
        labels:
          type: string
          default: counts
        language:
          type: string
          default: en
        min_count:
          type: number
          default: 0
        mobile_breakpoint:
          type: number
          default: 0
        networks:
          type: array
          items:
            $ref: '#/components/schemas/ShareNetworks'
        padding:
          type: number
          default: 12
        radius:
          type: number
          default: 0
        show_mobile:
          type: boolean
          default: false
        show_mobile_buttons:
          type: boolean
          default: true
        show_toggle:
          type: boolean
          default: true
        show_total:
          type: boolean
          default: false
        size:
          type: number
          default: 48
        slide_in:
          type: boolean
          default: true
        spacing:
          type: number
          default: 0
        subject:
          type: string
        top:
          type: number
          default: 100
        use_native_counts:
          type: boolean
          default: true
        preview:
          type: boolean
          default: false
    InlineFollowButtonsConfig:
      type: object
      properties:
        app_id:
          type: string
          enum:
          - inline-follow-buttons
        enabled:
          type: boolean
          default: true
        action:
          type: string
          default: 'Follow us:'
        action_enable:
          type: boolean
          default: true
        action_pos:
          type: string
          default: top
        alignment:
          type: string
          default: left
        color:
          type: string
          default: social
        fade_in:
          type: boolean
          default: true
        language:
          type: string
          default: en
        networks:
          type: array
          items:
            $ref: '#/components/schemas/FollowNetworks'
        padding:
          type: number
          default: 10
        profiles:
          type: object
          default: {}
        radius:
          type: number
          default: 0
        size:
          type: number
          default: 40
        spacing:
          type: number
          default: 8
        preview:
          type: boolean
          default: false
    InlineReactionButtonsConfig:
      type: object
      properties:
        app_id:
          type: string
          enum:
          - inline-reaction-buttons
        enabled:
          type: boolean
          default: true
        fade_in:
          type: boolean
          default: true
        min_count:
          type: number
          default: 0
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/Reactions'
        padding:
          type: number
          default: 10
        language:
          type: string
          default: en
        size:
          type: number
          default: 48
        url:
          type: string
    InlineShareButtonConfig:
      type: object
      properties:
        app_id:
          type: string
          enum:
          - inline-share-buttons
        enabled:
          type: boolean
          default: true
        alignment:
          type: string
          default: left
        background_color:
          type: string
          default: '#B581A3'
        color:
          type: string
          default: social
        fade_in:
          type: boolean
          default: true
        font_size:
          type: number
          default: 12
        text_color:
          type: string
          default: '#fff'
        language:
          type: string
          default: en
        min_count:
          type: number
          default: 0
        networks:
          type: array
          items:
            $ref: '#/components/schemas/ShareNetworks'
        padding:
          type: number
          default: 10
        radius:
          type: number
          default: 0
        show_mobile_buttons:
          type: boolean
          default: true
        size:
          type: number
          default: 40
        spacing:
          type: number
          default: 8
        subject:
          type: string
        use_native_counts:
          type: boolean
          default: true
        preview:
          type: boolean
          default: false
    Response:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          example: PROPERTY_CREATED
          description: Response code
        data:
          type:
          - object
          - 'null'
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
