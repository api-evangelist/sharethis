method: searched
source: >-
  registry.npmjs.org, repo.packagist.org, api.wordpress.org/plugins, api.github.com/orgs/sharethis-github,
  and https://sharethis.com/support/ (probed 2026-08-27)
summary: >-
  ShareThis distributes an installable plugin per CMS/framework rather than a conventional API client
  SDK. NONE of these packages wrap the Platform API — every one of them is a front-end embed for the
  share/follow/reaction buttons. There is no first-party client library for the Platform API, the
  share-count API or the MCP server in any language, in any registry. The currency spread is the
  story: the WordPress plugin was updated a week before this profile, while the React and Angular
  packages have not shipped a release in 4-6 years.
