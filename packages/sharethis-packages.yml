no_api_client_sdk:
  finding: true
  detail: >-
    Searched npm, PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist and crates.io plus the
    ShareThis GitHub organization (20 repositories). No first-party client library exists for the
    ShareThis Platform API, the Social Share Count API, or the MCP server. The only ShareThis-authored
    code artifacts are button embeds and — for the sibling Predactiv platform — the
    predactiv-mcp-python-samples repository, which is example agent code rather than a distributable
    package.
third_party_note: >-
  Several unaffiliated packages exist (react-sharethis, share-this, sunnysideup/sharethis,
  nitsan/ns-sharethis, clubdeuce/wp-share-this and others). They are NOT ShareThis-authored and are
  deliberately excluded from packages[] above.
