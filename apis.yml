apis:
- name: ShareThis Social Share Count API
  description: >-
    Public, unauthenticated GET endpoint returning aggregate social sharing metrics for any URL — clicks
    and shares broken out per network (facebook, twitter, linkedin, pinterest, whatsapp and dozens more),
    plus reaction counts and totals. Takes a single required url parameter; an optional wd=true flag serves
    counts for the legacy wd.sharethis.com widget.
  humanURL: https://sharethis.com/support/customization/social-share-count-api/
  baseURL: https://count-server.sharethis.com/v2.0
  tags:
  - Share Counts
  - Analytics
  - Public API
  properties:
  - type: Documentation
    url: https://sharethis.com/support/customization/social-share-count-api/
- name: ShareThis MCP Server
  description: >-
    First-party remote Model Context Protocol server letting AI assistants create and manage ShareThis
    properties, validate domain ownership, configure apps and inspect live app output. JSON-RPC 2.0 over
    POST to the host root, OAuth 2.1 account linking with PKCE, nine published tools with full JSON Schema
    input and output contracts.
  humanURL: https://sharethis.com/mcp/
  baseURL: https://mcp.sharethis.com
  tags:
  - Model Context Protocol
  - AI Agents
  - Properties
  - Apps
  properties:
  - type: MCPServer
    url: mcp/sharethis-mcp.yml
  - type: ToolCrosswalk
    url: mcp/sharethis-tool-crosswalk.yml
  - type: Documentation
    url: https://sharethis.com/mcp/
