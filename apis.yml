aid: sharethis
name: ShareThis
description: ShareThis is a Palo Alto, California website-tools and audience-data company, founded in
  2007 and now operating as a brand of Predactiv following the 2024 corporate rebrand. Its share, follow,
  reaction, image and video buttons are embedded across millions of publisher sites via a single sharethis.js
  loader, and the resulting real-time sharing behavior feeds the company's audience, analytics and targeting
  data products. For developers ShareThis publishes an OpenAPI 3.0.3-described Platform API for managing
  properties, app configurations, OAuth clients and AI summaries, an unauthenticated Social Share Count
  API, and a remote Model Context Protocol server at mcp.sharethis.com that exposes property and app management
  to AI agents over OAuth.
