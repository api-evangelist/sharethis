summary: >-
  Embeddable UI components are ShareThis's core product, not a side offering. Every component is
  loaded by one browser script and configured server-side against a Property, which means the
  Platform API and MCP server are effectively a configuration plane for these embeds — an unusual
  and quite coherent arrangement: an agent changes an app config through MCP and the rendered widget
  on the publisher's site changes.
